<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Vegard Gamnes – mine profiler på nettet.">
    <meta name="theme-color" content="#000000">
    <title>Vegard Gamnes</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(1rem, 5vw, 4rem);
        background: #000;
        color: #b4a795;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      main {
        width: 100%;
        max-width: 28rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 2rem;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2rem, 7vw, 3rem);
        font-weight: 400;
        line-height: 1.2;
        overflow-wrap: anywhere;
      }

      ul {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 11rem), 1fr));
        gap: 0.75rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      a {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 3.25rem;
        padding: 0.75rem 1rem;
        border: 1px solid #333;
        border-radius: 0.5rem;
        color: #36bdb2;
        text-decoration: none;
        overflow-wrap: anywhere;
      }

      a:visited {
        color: #36bdb2;
      }

      a:hover,
      a:focus-visible {
        border-color: #fd5158;
        color: #fd5158;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      a:focus-visible {
        outline: 2px solid #fd5158;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Vegard Gamnes</h1>
      <nav aria-label="Mine profiler">
        <ul>
          <li><a href="https://www.facebook.com/vegardga" rel="me">Facebook</a></li>
          <li><a href="https://www.youtube.com/user/vegardga" rel="me">YouTube</a></li>
          <li><a href="https://twitter.com/vegardga" rel="me">Twitter / X</a></li>
          <li><a href="https://github.com/vegardga" rel="me">GitHub</a></li>
          <li><a href="https://www.instagram.com/vegardga/" rel="me">Instagram</a></li>
          <li><a href="https://no.linkedin.com/in/vegardga/" rel="me">LinkedIn</a></li>
        </ul>
      </nav>
    </main>
  </body>
</html>
